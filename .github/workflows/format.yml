name: Format code (Prettier)

# Run by hand from the Actions tab: formats the code with Prettier, checks the
# site still builds, then commits the result to main.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - run: npm run build -- --base=/zzz-team-builder/
      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Already formatted"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Format code with Prettier"
          git push
          # Pushes made with this token don't start other workflows, so deploy by hand.
          gh workflow run deploy.yml --ref main
