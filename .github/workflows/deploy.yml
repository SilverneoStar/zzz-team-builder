name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a week, so songs newly added to the room's YouTube playlists show up.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Exact package versions from package-lock.json when it exists, and no
      # install scripts, so a hijacked package can't run code during the build.
      - run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      # The Tea Room's whole YouTube playlists: list each of their songs (titles and
      # ids only). If YouTube can't be read, the room plays them as one row instead.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yt-dlp && python tools/expand_playlists.py || echo "Playlists left as one row each"
      - run: npm run build -- --base=/zzz-team-builder/   # ← the repo name
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
